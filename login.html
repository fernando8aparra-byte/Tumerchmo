<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Iniciar Sesión | Tumerchmo</title>
  <link rel="icon" type="image/jpeg" href="https://firebasestorage.googleapis.com/v0/b/merchct-d059a.firebasestorage.app/o/logo%2Flogo.jpg?alt=media">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
    }
    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      font-weight: 900;
      font-size: 2.1rem;
      color: #000;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 24px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #444;
      font-size: 0.92rem;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #000;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.08);
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin: 12px 0 8px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }
    .btn-primary {
      background: #000;
      color: white;
    }
    .btn-primary:hover { background: #222; transform: translateY(-1px); }
    .btn-google {
      background: #fff;
      color: #1f1f1f;
      border: 1px solid #dadce0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-google:hover { background: #f8f9fa; border-color: #c6cacf; }
    .google-icon {
      width: 20px;
      height: 20px;
    }
    .toggle-link {
      color: #000;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
    }
    .toggle-link:hover { text-decoration: underline; }
    .message {
      margin: 16px 0;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .success { background: #e6ffe6; color: #006400; border: 1px solid #b3ffb3; }
    .error { background: #ffe6e6; color: #8b0000; border: 1px solid #ffb3b3; }
    .back-link {
      display: block;
      margin-top: 32px;
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-link:hover { color: #000; text-decoration: underline; }

    .public-footer {
      width: 100%;
      max-width: 420px;
      text-align: center;
      font-size: 0.88rem;
      color: #555;
      line-height: 1.6;
      padding-bottom: 8px;
    }
    .public-footer a { color:#000; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">Tumerchmo</div>
    <p class="subtitle" id="formSubtitle">Inicia sesión o crea tu cuenta</p>
    <div id="message" class="message" style="display:none;"></div>
    <form id="authForm">
      <div class="form-group" id="usernameGroup" style="display:none;">
        <label for="username">Nombre de usuario (handle)</label>
        <input type="text" id="username" placeholder="TuNombreCT" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="mainActionBtn">Iniciar Sesión</button>
    </form>
    <button class="btn btn-google" id="googleBtn">
      <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.3 0 6.2 1.1 8.5 3.2l6.3-6.3C34.8 2.8 29.8.5 24 .5 14.6.5 6.5 5.9 2.6 13.8l7.4 5.7C12 13.8 17.5 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.6h12.7c-.5 2.8-2.1 5.2-4.4 6.8l6.8 5.2c4-3.7 6.4-9.2 6.4-16.1z"/>
        <path fill="#FBBC05" d="M9.9 28.6c-.5-1.4-.9-2.9-.9-4.6s.3-3.2.9-4.6l-7.4-5.7C.9 16.9 0 20.4 0 24s.9 7.1 2.5 10.3l7.4-5.7z"/>
        <path fill="#34A853" d="M24 47.5c6 0 11-2 14.7-5.4l-6.8-5.2c-1.9 1.3-4.4 2.1-7.9 2.1-6.5 0-12-4.3-14-10.3l-7.4 5.7C6.5 42.1 14.6 47.5 24 47.5z"/>
      </svg>
      Continuar con Google
    </button>
    <p style="margin-top: 24px; font-size: 0.92rem;">
      <span id="toggleText">¿No tienes cuenta?</span>
      <span class="toggle-link" id="toggleMode">Regístrate aquí</span>
    </p>
    <a href="index.html" class="back-link">← Volver a la tienda</a>
  </div>
  <footer class="public-footer">
    <a href="acerca_de_nosotros.html">Acerca de nosotros</a> ·
    <a href="politicas_privacidad.html">Políticas de privacidad</a> ·
    <a href="politicas_privacidad.html#reembolsos">Reembolsos</a><br>
    Contacto: +52 6624672947 · Soporte Tumerchmo
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBRCq0FuAY5NYBcQFv03WmdmUSehi1L_B4",
      authDomain: "merchct-d059a.firebaseapp.com",
      projectId: "merchct-d059a",
      storageBucket: "merchct-d059a.firebasestorage.app",
      messagingSenderId: "290525612160",
      appId: "1:290525612160:web:1aca5527196597c3eebe65",
      measurementId: "G-5VE65DCLCW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // Lista de correos con acceso administrativo completo (super admins)
    const superAdminEmails = [
      "fernando8aparra@gmail.com",
      "luisatondo28@gmail.com",
      "rafaalejandrovm@gmail.com",
      "fpprem184@gmail.com"
      // ← agrega aquí más correos de super admin si los hay
    ];

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const usernameInput = document.getElementById('username');
    const usernameGroup = document.getElementById('usernameGroup');
    const mainBtn = document.getElementById('mainActionBtn');
    const googleBtn = document.getElementById('googleBtn');
    const toggleLink = document.getElementById('toggleMode');
    const toggleText = document.getElementById('toggleText');
    const subtitle = document.getElementById('formSubtitle');
    const messageDiv = document.getElementById('message');

    let isLoginMode = true;
    const urlParams = new URLSearchParams(location.search);
    if (urlParams.get('mode') === 'register') isLoginMode = false;

    function showMessage(text, isError = false) {
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + (isError ? 'error' : 'success');
      messageDiv.style.display = 'block';
      setTimeout(() => messageDiv.style.display = 'none', 6000);
    }

    function updateFormUI() {
      if (isLoginMode) {
        subtitle.textContent = "Inicia sesión en tu cuenta";
        mainBtn.textContent = "Iniciar Sesión";
        toggleText.textContent = "¿No tienes cuenta?";
        toggleLink.textContent = "Regístrate aquí";
        usernameGroup.style.display = 'none';
        usernameInput.required = false;
      } else {
        subtitle.textContent = "Crea tu cuenta en segundos";
        mainBtn.textContent = "Crear Cuenta";
        toggleText.textContent = "¿Ya tienes cuenta?";
        toggleLink.textContent = "Inicia sesión";
        usernameGroup.style.display = 'block';
        usernameInput.required = true;
      }
    }

    toggleLink.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      updateFormUI();
    });

    // Función principal de redirección según rol
    async function redirectBasedOnRole(user, options = {}) {
      const isNewSignup = options.isNewSignup === true;
      const email = user.email.toLowerCase();

      // 1. ¿Es super admin? (lista fija)
      if (superAdminEmails.includes(email)) {
        showMessage("¡Acceso administrativo completo! Redirigiendo...");
        setTimeout(() => location.href = "admin.html", 1500);
        return;
      }

      // 2. ¿Es admin jr? (existe en colección y activo = true)
      try {
        const adminJrRef = doc(db, "adminjr_permisos", email);
        const adminJrSnap = await getDoc(adminJrRef);

        if (adminJrSnap.exists() && adminJrSnap.data().activo === true) {
          showMessage("¡Bienvenido Admin Jr! Redirigiendo...");
          setTimeout(() => location.href = "adminjr.html", 1500);
          return;
        }
      } catch (err) {
        console.error("Error al verificar admin jr:", err);
      }

      // 3. Usuario normal → tienda
      showMessage("¡Sesión iniciada! Redirigiendo a la tienda...");
      setTimeout(() => {
        const nextUrl = isNewSignup ? "index.html?welcomeDiscount=1" : "index.html";
        location.href = nextUrl;
      }, 1500);
    }

    // Login / Registro con email + contraseña
    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value.trim();
      const username = usernameInput.value.trim();

      if (!email || !password) {
        showMessage("Completa correo y contraseña", true);
        return;
      }

      if (!isLoginMode && (!username || username.length < 3)) {
        showMessage("El nombre de usuario debe tener al menos 3 caracteres", true);
        return;
      }

      try {
        let userCredential;
        if (isLoginMode) {
          userCredential = await signInWithEmailAndPassword(auth, email, password);
        } else {
          userCredential = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(userCredential.user, { displayName: username });
          localStorage.setItem(`privacyAccepted_${userCredential.user.uid}`, 'false');
        }

        await redirectBasedOnRole(userCredential.user, { isNewSignup: !isLoginMode });
      } catch (error) {
        let msg = "Error desconocido";
        switch (error.code) {
          case 'auth/wrong-password': msg = "Contraseña incorrecta"; break;
          case 'auth/user-not-found': msg = "No existe esa cuenta"; break;
          case 'auth/email-already-in-use': msg = "Este correo ya está registrado"; break;
          case 'auth/weak-password': msg = "Contraseña muy débil (mínimo 6 caracteres)"; break;
          case 'auth/invalid-email': msg = "Correo inválido"; break;
          default: msg = error.message;
        }
        showMessage(msg, true);
      }
    });

    // Login con Google
    googleBtn.addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;

        if (!user.displayName) {
          const defaultName = user.email.split('@')[0].replace(/\./g, '');
          await updateProfile(user, { displayName: defaultName });
        }

        if (result.additionalUserInfo?.isNewUser) {
          localStorage.setItem(`privacyAccepted_${user.uid}`, 'false');
        }
        await redirectBasedOnRole(user, { isNewSignup: Boolean(result.additionalUserInfo?.isNewUser) });
      } catch (error) {
        let msg = "Error con Google";
        if (error.code === 'auth/popup-closed-by-user') msg = "Ventana cerrada";
        else if (error.code === 'auth/account-exists-with-different-credential') msg = "Cuenta ya existe con otro método";
        else msg = error.message;
        showMessage(msg, true);
      }
    });

    // Si ya hay sesión activa al cargar la página → redirigir directamente
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        await redirectBasedOnRole(user);
      }
    });

    updateFormUI();
  </script>

</body>
</html>
